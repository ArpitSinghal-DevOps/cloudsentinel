name: terraform

on:
  # Always runs on PRs so the required checks report even for docs-only changes.
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, and never cancel a run that might be mid-apply.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.7
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: eu-north-1
  TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.66.0
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.8
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  checks:
    name: fmt / validate / tflint / checkov / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in bootstrap infra; do
            terraform -chdir="$dir" init -backend=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the aws ruleset
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/data" -w /data --entrypoint sh "$TFLINT_IMAGE" -c '
            tflint --init &&
            tflint --chdir=bootstrap --config=/data/.tflint.hcl &&
            tflint --chdir=infra --config=/data/.tflint.hcl'

      - name: Checkov
        run: docker run --rm -v "$PWD:/src" "$CHECKOV_IMAGE" -d /src --framework terraform --quiet --compact

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --log-opts=HEAD

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13" # same as the Lambda runtime

      - name: Lambda tests
        working-directory: infra/lambda/remediate_s3
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

  plan:
    name: plan
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -no-color -lock-timeout=2m

  apply:
    name: apply
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform plan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -no-color -lock-timeout=2m -out=tfplan

      # Applies exactly the plan printed above.
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=2m tfplan
